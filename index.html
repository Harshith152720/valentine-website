<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 💖</title>
    <!-- Deployment Trigger -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Outfit:wght@400;600&family=Playfair+Display:ital,wght@1,500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="background-effects" id="background-effects">
        <div class="gradient-sphere one"></div>
        <div class="gradient-sphere two"></div>
    </div>

    <main class="main-container">
        <!-- Step 1: Initial Hook -->
        <div class="card glass-effect step active" id="step-1">
            <div class="image-wrapper">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbm5pZGFnYXp5YXBnaHhyNHpueXpueXpueXpueXpueXpueXpueSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/v9G3NGByE9x16/giphy.gif"
                    alt="Cute Wave" class="gif-img">
            </div>
            <h1>Are you ready for a surprise? ✨</h1>
            <p class="subtitle">I have something to ask you...</p>
            <button class="btn btn-primary" onclick="nextStep(2)">Yes, I'm ready! ➡️</button>
        </div>

        <!-- Step 2: Care Question -->
        <div class="card glass-effect step" id="step-2">
            <div class="image-wrapper">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueXpueXpueXpueXpueXpueXpueXpueXpueSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/L3jf6uXJ3wZ7x6/giphy.gif"
                    alt="Love eyes" class="gif-img">
            </div>
            <h1>Wait... 🛑</h1>
            <p class="subtitle">Did you know you're the most amazing person I've ever met?</p>
            <button class="btn btn-primary" onclick="nextStep(3)">Aww, tell me more! 😊</button>
        </div>

        <!-- Step 3: Game/Team Question -->
        <div class="card glass-effect step" id="step-3">
            <div class="image-wrapper">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueXpueXpueXpueXpueXpueXpueXpueXpueSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/vK6I7Xf1W6M4S1Aoy8/giphy.gif"
                    alt="Together" class="gif-img">
            </div>
            <h1>Do you think we make a great team? 👫</h1>
            <div class="buttons-grid">
                <button class="btn btn-primary" onclick="nextStep(4)">The best! 🏆</button>
                <button class="btn btn-secondary" onclick="nextStep(4)">Forever and always! ♾️</button>
            </div>
        </div>

        <!-- Step 4: The Main Valentine Question -->
        <div class="card glass-effect step" id="main-card">
            <div class="image-wrapper">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueXpueXpueXpueXpueXpueXpueXpueXpueSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif"
                    alt="Cute Cat" class="gif-img main-ask-gif" id="main-gif">
            </div>
            <h1 class="big-question">Will you be my Valentine?</h1>
            <p class="subtitle">I really hope you say yes! 🥺</p>

            <div class="buttons action-buttons">
                <button id="yes-btn" class="btn btn-yes">Yes, definitely! 😍</button>
                <button id="no-btn" class="btn btn-no">No 😢</button>
            </div>
            <div class="extra-surprise">
                <button class="btn btn-secret" id="reasons-btn">Why I love you? ✨</button>
                <p id="reason-text" class="reason-popup"></p>
            </div>
        </div>

        <!-- Simple Celebration -->
        <div class="card glass-effect step" id="celebration-card">
            <div class="image-wrapper">
                <img src="https://media.giphy.com/media/T86i6yDyOYz7J6v9d5/giphy.gif" alt="Happy Hug" class="gif-img">
            </div>
            <h1 class="celebrate-title">YAY! ❤️</h1>
            <p class="love-note">You've made me the happiest person ever!</p>
            <button class="btn btn-white" onclick="location.reload()">Replay 🔄</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
